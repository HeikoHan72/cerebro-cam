[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebrocam"
version = "0.1.0"
description = "Brain tumor MRI classification with a compact CNN"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "keras>=3.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "seaborn",
]

[tool.setuptools]
packages = ["cerebrocam"]
